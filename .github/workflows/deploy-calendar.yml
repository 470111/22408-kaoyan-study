name: Deploy Calendar to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-calendar
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build calendar
        run: |
          node scripts/parse-schedule.mjs
          cd calendar
          npm ci
          npm run build

      - name: Deploy to gh-pages (subpath /calendar)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./calendar/dist
          destination_dir: calendar
          commit_message: 'deploy: calendar'
