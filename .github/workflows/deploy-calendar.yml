name: Deploy Calendar to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'calendar/**'
      - 'scripts/parse-schedule.mjs'
      - '数学408-*.md'
      - '.github/workflows/deploy-calendar.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and build
        run: |
          cd calendar
          npm install
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: calendar/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
